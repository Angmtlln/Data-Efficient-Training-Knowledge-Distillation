[project]
name = "data-selection-sst2"
version = "0.1.0"
description = "Data selection strategies for fine-tuning ModernBERT on 10% of SST-2"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.48",
    "datasets>=3.0",
    "accelerate>=1.0",
    "evaluate>=0.4",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "tqdm",
    "ipykernel",
    "cleanlab>=2.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
